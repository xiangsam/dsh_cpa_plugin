name: Publish to GitHub Packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate the package without publishing it
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@xiangsam'

      - name: Verify the tag matches package.json
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match package.json version $version"
            exit 1
          fi

      - name: Resolve the publish mode
        id: mode
        env:
          # github.event.inputs carries the raw dispatch string; the inputs
          # context can render empty here, which would silently publish.
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
        run: |
          echo "event=${{ github.event_name }} dry_run=[${DRY_RUN_INPUT}]"
          case "${DRY_RUN_INPUT:-false}" in
            true|True|TRUE|1) echo "dry_run=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "dry_run=false" >> "$GITHUB_OUTPUT" ;;
          esac
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-*) prerelease="${version#*-}"; echo "tag_args=--tag ${prerelease%%.*}" >> "$GITHUB_OUTPUT" ;;
            *) echo "tag_args=" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.mode.outputs.dry_run }}" = "true" ]; then
            npm publish --dry-run ${{ steps.mode.outputs.tag_args }}
          else
            npm publish ${{ steps.mode.outputs.tag_args }}
          fi
